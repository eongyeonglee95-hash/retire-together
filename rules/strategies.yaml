# 전략 템플릿 — 비율 숫자의 단일 원천 (docs/REBALANCING_RULES.md §1)
# 합계는 반드시 100. 사용자가 선택·수정한다. Agent는 바꾸지 않는다.
strategies:
  all_weather:
    name: 올웨더(해외) — 시그널스노우볼 템플릿 기준
    threshold_pp: 5          # 발동 임계치 ±5%p (2026-10-26 확정). 앱은 "매년 1회" 리밸런싱이지만 우리는 밴드만 쓴다
    min_trade_krw: 100000
    # 2026-10-27 사용자 결정: 시그널스노우볼 앱 "③ 해외 올웨더 포트폴리오" 비율·예시 종목을 그대로 쓴다 (사용자 캡처, wiki/sources/pension-knowledge-sources.md).
    # 2026-10-26 결정 세 가지(금=원자재 15, 장기채 환노출 476760, 중기채 ACE 국고채10년 365780)를 이것으로 대체. 사유는 docs/DECISIONS.md·REBALANCING §4-1.
    # 원형(로빈스 All Seasons)은 30/40/15/7.5/7.5 — 앱은 금 8 / 원자재 7로 반올림.
    targets:
      stock: 30
      long_bond: 40
      mid_bond: 15
      gold: 8
      commodity: 7
    source: "시그널스노우볼(해빗팩토리) 예상 연금 탭 '③ 해외 올웨더 포트폴리오', 2026-10 기준 예시. 사용자 캡처 2026-10-27"
    # 전략이 정하는 자산군별 종목 유형과 기본 종목 (REBALANCING §1-2 2층 구조). ticker가 있으면 asset_map class_defaults보다 우선. 매수는 지정 종목으로.
    # 앱 면책 문구: "종목코드는 2026년 10월 기준 예시이며, 추천이 아닙니다. 매수 전 거래 증권사에서 직접 확인하세요" — 우리도 같은 뜻.
    instruments:
      stock:     {ticker: "360750", name: TIGER 미국S&P500, type: "미국 대형주 지수 (앱 예시 TIGER 360750 · ACE 360200, 보유 많은 TIGER)"}
      mid_bond:  {ticker: "308620", name: KODEX 미국10년국채선물, type: "미국 중기채 — 선물형 (앱 표기 'KODEX 미국채10년선물', 현재 상장명 KODEX 미국10년국채선물. 앱 예시 KODEX 308620 · TIGER 305080). 보유 ACE 종합채권은 mid_bond로 계속 세고 추가 매수만 이 종목"}
      long_bond: {ticker: "453850", name: ACE 미국30년국채액티브(H), type: "미국 장기채 — 환헤지 (앱 예시 ACE(H) 453850 · 'KODEX 미국채30년액티브(H) 438470'). 환노출 476760은 후보로 남김"}
      gold:      {ticker: "411060", name: ACE KRX금현물, type: "금 현물 (앱 예시 ACE 411060 · KODEX 골드선물(H) 132030)"}
      commodity: {ticker: "261220", name: KODEX WTI원유선물(H), type: "원자재 — 원유 선물형, 환헤지 (앱 예시 KODEX 261220 · TIGER 원유선물Enhanced(H) 130680). 단일 품목·선물형이라는 점은 §4-1에"}
  k_all_weather:
    name: K-올웨더 (김성일, 『마법의 연금굴리기』)
    threshold_pp: 5
    min_trade_krw: 100000
    targets: {}              # 사용자 확인 대기 (2026-10-27). 후보 셋: (A) 2022·2023 기사 비율, (B) 저자 2026-10 칼럼 — wiki/strategies/kim-sungil-k-all-weather.md
                             # (C) 시그널스노우볼 앱 "국내 올웨더" 한국 대형주 30 / 한국 국고채10년 55 / 금 15 — 김성일 원문 아님, 앱 템플릿 (wiki/sources/pension-knowledge-sources.md). 책 확인 후 사용자가 고른다
    source: null
  park_gomhee:
    name: 박곰희 포트폴리오 (『박곰희 연금 부자 수업』 2025)
    threshold_pp: 5          # 저자 규칙 아님(저자는 연 1회 생일 기준). 우리는 ±5%p 밴드만 쓴다 (2026-10-26 결정)
    min_trade_krw: 100000
    # 2026-10-27 사용자 지시로 책 비율·종목을 넣음. 국내주식은 책의 펀드 대신 KODEX 200(사용자 결정 2026-10-27). 저자 7자산을 우리 키 6개로 접었다 — 접으면서 사라진 구분은 labels·주석에.
    # 원본: 국내주식 30 / 해외주식 25 / 채권 20 / 배당주 10 / 리츠 5 / 금 5 / 달러 5 (책 자산배분 모델 절 + 종목 표 2025-01-25, wiki/strategies/parkgomhee.md)
    targets:
      stock: 70              # 국내주식 30 + 해외주식 25 + 배당주 10 + 리츠 5
      long_bond: 20          # 채권 20 = 국고채 30년
      gold: 5
      cash: 5                # 달러 5. 아래 instruments.cash 종목을 엔진이 매수한다 (2026-10-27 보완, REBALANCING §1-2). 보유 달러 ETF는 cash로 태깅해야 센다 (asset_map)
    source: "『박곰희 연금 부자 수업』(인플루엔셜 2025) Part 3 '4. 박곰희 포트폴리오' + 종목 표(2025-01-25 기준). 사용자 촬영 2026-10-26"
    labels:
      stock: "주식 (국내·해외·배당·리츠)"
      cash: "달러"
    instruments:             # 책 종목. 종목코드는 2026-10-26 네이버 종목 검색으로 확인
      stock:     {ticker: "069500", name: KODEX 200, type: "국내주식 30 자리. 책은 공모펀드(VIP 한국형가치투자A-e)였으나 2026-10-27 사용자: KODEX 200으로 대체. 주식 70 안의 나머지 — 해외 25 PLUS 미국S&P500(H) 269540, 배당 10 SOL 미국배당다우존스(H) 452360, 리츠 5 KODEX 한국부동산리츠인프라 476800 — 은 자산군 키가 stock 하나라 엔진이 따로 못 산다(열린 항목: 하위 키 분리). 보유 중인 것은 각자 stock으로 세어진다"}
      long_bond: {ticker: "439870", name: KODEX 국고채30년액티브, type: "국내 국고채 30년"}
      gold:      {ticker: "411060", name: ACE KRX금현물, type: "KRX 금현물"}
      cash:      {ticker: "456610", name: TIGER 미국달러SOFR금리액티브(합성), type: "달러 단기금리(SOFR) 합성 — cash 지정 종목은 매수만, 매도 없음"}
  custom:
    name: 직접 설정
    threshold_pp: 5
    min_trade_krw: 100000
    targets: {}              # 사용자가 화면에서 채움

