# 전략 템플릿 — 비율 숫자의 단일 원천 (docs/REBALANCING_RULES.md §1)
# 합계는 반드시 100. 사용자가 선택·수정한다. Agent는 바꾸지 않는다.
strategies:
  all_weather:
    name: 올웨더(달리오 원형)
    threshold_pp: 5          # 발동 임계치 ±5%p (2026-10-26 확정)
    min_trade_krw: 100000    # 최소 거래 금액
    targets:
      stock: 30
      long_bond: 40
      mid_bond: 15
      gold: 15                 # 원형은 금 7.5 + 원자재 7.5. 2026-10-26 사용자: 국내 상장 원자재 바스켓 ETF가 없어 원자재를 금에 합침 (단일 원자재 ETF는 품목 베팅·고비용). 바스켓 ETF가 생기면 다시 나눈다
    labels:
      gold: "금 (=원자재)"     # 화면·주문표 표시. 원자재 몫을 금이 대신한다는 뜻
    # 전략이 정하는 자산군별 종목 유형과 기본 종목 (REBALANCING §1-2 2층 구조, 2026-10-26). ticker가 있으면 asset_map class_defaults보다 우선.
    # type은 사람이 읽는 설명(원형 정의, docs/wiki/strategies/dalio-all-weather.md). 유형 안에서 종목 하나는 §1-2 ④~⑥ 룰로 고른다.
    instruments:
      long_bond: {ticker: "476760", name: ACE 미국30년국채액티브, type: "미국 국채 20년+ 환노출 (2026-10-26 사용자 확정. 유형 안에서 거래량 40만주·보수 0.05%로 선택, wiki/products/long-bond-commodity-candidates.md)"}
      # 중기채 코멘트 (2026-10-26 사용자): 보유 중인 ACE 종합채권(AA-이상)액티브(356540)는 mid_bond로 분류하되, 올웨더 원형의 중기채(미국 국채 7~10년, 듀레이션 7~8년)보다
      # 듀레이션이 짧고(4.7년) 회사채·통안채가 섞여 완충이 약하다. 그래서 올웨더에서 중기채를 새로 살 때는 만기가 원형에 가까운 국고채 10년물을 쓴다 (같은 운용사, 보수 0.02%).
      # 기존 종합채권은 팔지 않고 중기채로 계속 센다. 근거: docs/wiki/products/holdings-classification.md
      mid_bond:  {ticker: "365780", name: ACE 국고채10년, type: "미국 국채 7~10년 원형 → 국내 국고채 10년(듀레이션 7.5년)으로 대체. 보유 ACE 종합채권은 중기채로 인정하되 신규 매수는 이 종목"}
      # commodity: 이 전략에서는 비중 0 (금에 합침). 바스켓 ETF 상장 시 targets에 commodity를 되살리고 여기 종목 지정
  k_all_weather:
    name: K-올웨더 (김성일, 『마법의 연금굴리기』)
    threshold_pp: 5
    min_trade_krw: 100000
    targets: {}              # 사용자 확인 대기 (2026-10-27). 후보 셋: (A) 2022·2023 기사 비율, (B) 저자 2026-10 칼럼 — wiki/strategies/kim-sungil-k-all-weather.md
                             # (C) 시그널스노우볼 앱 "국내 올웨더" 한국 대형주 30 / 한국 국고채10년 55 / 금 15 — 김성일 원문 아님, 앱 템플릿 (wiki/sources/pension-knowledge-sources.md). 책 확인 후 사용자가 고른다
    source: null
  park_gomhee:
    name: 박곰희 포트폴리오 (『박곰희 연금 부자 수업』 2025)
    threshold_pp: 5          # 저자 규칙 아님(저자는 연 1회 생일 기준). 우리는 ±5%p 밴드만 쓴다 (2026-10-26 결정)
    min_trade_krw: 100000
    # 2026-10-27 사용자 지시로 책 비율·종목을 넣음. 저자 7자산을 우리 키 6개로 접었다 — 접으면서 사라진 구분은 labels·주석에.
    # 원본: 국내주식 30 / 해외주식 25 / 채권 20 / 배당주 10 / 리츠 5 / 금 5 / 달러 5 (책 자산배분 모델 절 + 종목 표 2025-01-25, wiki/strategies/parkgomhee.md)
    targets:
      stock: 70              # 국내주식 30 + 해외주식 25 + 배당주 10 + 리츠 5
      long_bond: 20          # 채권 20 = 국고채 30년
      gold: 5
      cash: 5                # 달러 5. 주의: 엔진은 cash 목표를 예수금으로 보고 매수하지 않는다 → 달러 ETF 매수는 엔진 보완 전까지 수동 (열린 항목)
    source: "『박곰희 연금 부자 수업』(인플루엔셜 2025) Part 3 '4. 박곰희 포트폴리오' + 종목 표(2025-01-25 기준). 사용자 촬영 2026-10-26"
    labels:
      stock: "주식 (국내·해외·배당·리츠)"
      cash: "달러"
    instruments:             # 책 종목. 종목코드는 2026-10-26 네이버 종목 검색으로 확인
      stock:     {ticker: "269540", name: PLUS 미국S&P500(H), type: "책 해외주식 종목(환헤지). 국내주식은 책이 공모펀드(VIP 한국형가치투자A-e)라 종목코드 없음 → 미반영. 배당주 SOL 미국배당다우존스(H) 452360, 리츠 KODEX 한국부동산리츠인프라 476800은 asset_map에서 stock으로 매핑"}
      long_bond: {ticker: "439870", name: KODEX 국고채30년액티브, type: "국내 국고채 30년"}
      gold:      {ticker: "411060", name: ACE KRX금현물, type: "KRX 금현물"}
      cash:      {ticker: "456610", name: TIGER 미국달러SOFR금리액티브(합성), type: "달러 단기금리(SOFR) 합성 — 엔진이 cash를 매수하지 않으므로 현재는 표시용"}
  custom:
    name: 직접 설정
    threshold_pp: 5
    min_trade_krw: 100000
    targets: {}              # 사용자가 화면에서 채움

# "왜 지금" 설명용 가정 하락장 (docs/CALCULATION_RULES.md §3)
shock:
  stock: -0.30
  long_bond: 0.05
  mid_bond: 0.02
  gold: 0.0
  commodity: -0.10
  cash: 0.0
