[project]
name = "retiretogether"
version = "0.1.0"
description = "둘이서은퇴 — 부부 연금·현금 주머니를 규칙대로 굴리는 은퇴 가계 노트 (Pension Rebalancing Agent PoC)"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.174",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.0",
]
